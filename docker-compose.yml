version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ventureiq_postgres
    restart: always
    environment:
      POSTGRES_USER: ventureiq_user
      POSTGRES_PASSWORD: ventureiq_password
      POSTGRES_DB: ventureiq_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ventureiq_user -d ventureiq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: ventureiq_api
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://ventureiq_user:ventureiq_password@db:5432/ventureiq_db
      SYNC_DATABASE_URL: postgresql://ventureiq_user:ventureiq_password@db:5432/ventureiq_db
      SECRET_KEY: test_secret_key_change_in_production_1234567890
      CORS_ORIGINS: http://localhost:3000
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: ventureiq_web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
